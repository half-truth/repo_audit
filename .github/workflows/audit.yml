name: audit

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'repo URL or owner/repo'
        required: true
      ref:
        description: 'branch/tag (default HEAD)'
        required: false
        default: 'HEAD'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Run audit
        env:
          REPO: ${{ inputs.repo_url }}
          REF: ${{ inputs.ref }}
        run: |
          set -o pipefail
          ./target/release/repo-audit audit "$REPO" --ref "$REF" \
            --cache-dir "$GITHUB_WORKSPACE/.audit-cache" \
            --tmp-dir "$GITHUB_WORKSPACE/.audit-tmp" \
            | tee report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: report.txt
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -rf .audit-cache .audit-tmp
